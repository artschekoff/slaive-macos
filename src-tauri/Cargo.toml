[package]
name = "slaive"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
cpal = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
tokio = { version = "1", features = ["fs", "io-util"] }
whisper-rs = { version = "0.16", features = ["metal"] }
core-foundation = "0.10"
core-graphics = "0.25"

[profile.release]
strip = true
# lto выключен намеренно. При lto = true релиз не линкуется:
#   Undefined symbols for architecture arm64:
#     "___isPlatformVersionAtLeast", referenced from:
#         _ggml_metal_buffer_free in libwhisper_rs_sys.rlib(ggml-metal-device.m.o)
# Metal-слой whisper.cpp написан на Objective-C и проверяет доступность API
# через @available; вспомогательный символ для этого живёт в рантайме clang.
# LTO сливает всё в одну единицу трансляции и теряет его неявную линковку.
# Debug при этом собирается — расхождение проявляется только в релизе.
# ponytail: выключить целиком проще, чем чинить линковку рантайма; если
# размер бинарника станет важен — линковать libclang_rt.osx явно и вернуть lto.
lto = false
