[package]
name = "slaive"
version = "0.5.1"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
cpal = "0.15"
# Уже в дереве через cpal — здесь только прямой доступ ради mute выходного
# устройства на время записи (см. system_audio.rs): ни одной новой единицы
# компиляции, версия та же, что в Cargo.lock.
coreaudio-sys = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = "0.3"
tokio = { version = "1", features = ["fs", "io-util", "sync", "macros"] }
whisper-rs = { version = "0.16", features = ["metal"] }
core-foundation = "0.10"
core-graphics = "0.25"
# Нужен ровно один вызов — `-[NSWindow setAlphaValue:]` (см. macos.rs).
# Набор фич выписан поимённо и совпадает с тем, что уже включает tao (его
# Cargo.toml, секция objc2-app-kit): при объединении фич cargo это ТЕ ЖЕ
# модули, что и так компилируются для окон Tauri, — ни одной новой единицы
# трансляции и ни одной новой загрузки из сети. `default-features = false`
# здесь обязателен: дефолт objc2-app-kit — весь AppKit целиком (три сотни
# классов), и он бы утроил время сборки ради одного сеттера.
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "NSPasteboard",
    "NSResponder",
    "NSWindow",
] }
# Дефолтная фича "v1" тянет за собой windows-native-keyring-store и
# zbus-secret-service-keyring-store, но обе — под платформенным cfg (Windows
# и не-macOS unix), поэтому на macOS они не попадают в граф сборки вообще;
# здесь реально компилируется только apple-native-keyring-store с бэкендом
# "keychain" (классический SecKeychain, видимый в Keychain Access.app).
# Проверено `cargo tree`.
keyring = "4.2.0"
# Ровно один вызов — AVCaptureDevice.authorizationStatus(for: .audio) для
# строки «Microphone» в окне Setup (см. macos::microphone_permission):
# другого способа УЗНАТЬ статус разрешения, не дёргая запись, у macOS нет.
# Набор фич минимальный по тому же доводу, что у objc2-app-kit выше.
objc2-av-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "AVCaptureDevice",
    "AVMediaFormat",
    "block2",
] }
# Обе и так в дереве (их тянут objc2-app-kit/av-foundation) — здесь только
# прямой доступ ради completion-блока микрофонной пробы в macos.rs:
# block2 собирает Objective-C блок, objc2 даёт его тип Bool. Версии те же,
# что уже в Cargo.lock, — ни одной новой единицы компиляции.
block2 = "0.6"
objc2 = "0.6"
# Проверка лицензионных ключей офлайн (см. license.rs): подпись Ed25519,
# публичный ключ зашит в бинарь, сети не нужно. default-features = false
# отрезает rand и прочее — для verify/sign хватает std.
ed25519-dalek = { version = "2", default-features = false, features = ["std", "fast"] }
# Файловый лог диагностики (см. src-tauri/src/main.rs) — пишет в
# app_log_dir() (~/Library/Logs/net.slaive.app на macOS). `log` — сами
# макросы (warn!/error!/info!), tauri-plugin-log — их бэкенд с ротацией.
tauri-plugin-log = "2"
log = "0.4"
# Round-trip форматирования захваченного текста (см. format.rs): rich-выделение
# из чужого приложения приходит как HTML, храним и правим его как Markdown, а
# вставляем обратно в одном из трёх форматов. pulldown-cmark — md→html и md→plain
# (разбор событий), html2md — обратный ход html→md. Оба лёгкие, без C-зависимостей.
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
html2md = "0.2"

[profile.release]
# Полный strip убирал таблицу символов целиком: крэш-репорты macOS
# (~/Library/Logs/DiagnosticReports) показывали голые адреса вида
# `slaive: 0x7c43cc` вместо имён функций — диагностировать по ним нечего.
# "debuginfo" снимает DWARF (номера строк, инлайны — самая тяжёлая часть),
# но оставляет таблицу символов (nlist), которой достаточно для имени
# функции и модуля во frame крэш-репорта; это то, что даёт adrs → «человек
# понял, где искать», а не строку в файле. Дальше уже не жать: "none"
# заметно раздувает бинарник ради данных, не нужных без dSYM под рукой.
strip = "debuginfo"
# lto выключен намеренно. При lto = true релиз не линкуется:
#   Undefined symbols for architecture arm64:
#     "___isPlatformVersionAtLeast", referenced from:
#         _ggml_metal_buffer_free in libwhisper_rs_sys.rlib(ggml-metal-device.m.o)
# Metal-слой whisper.cpp написан на Objective-C и проверяет доступность API
# через @available; вспомогательный символ для этого живёт в рантайме clang.
# LTO сливает всё в одну единицу трансляции и теряет его неявную линковку.
# Debug при этом собирается — расхождение проявляется только в релизе.
# ponytail: выключить целиком проще, чем чинить линковку рантайма; если
# размер бинарника станет важен — линковать libclang_rt.osx явно и вернуть lto.
lto = false
